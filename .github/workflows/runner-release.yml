name: Runner release

on:
  push:
    tags: [runner-v*]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish runner archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify neiro source
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/neiro

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build runner
        run: bun --filter='@itsaplan/runner' run build

      - name: Pack runner
        working-directory: packages/runner
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          bun pm pack --filename "$GITHUB_WORKSPACE/release-assets/itsaplan-runner.tgz"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/itsaplan-runner.tgz \
            --verify-tag \
            --title "Runner ${GITHUB_REF_NAME#runner-v}" \
            --notes "Runner built from $GITHUB_SHA for the neiro production branch."
